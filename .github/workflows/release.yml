name: Test and release
on:
  push:
    branches: [main]
    paths: ["plugin/**", "scripts/**", "tests/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["plugin/**", "scripts/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release after all tests pass"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    outputs:
      publish: ${{ steps.release_scope.outputs.publish }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, openssl, pdo_sqlite, zip
          coverage: none
      - name: Determine installable release changes
        id: release_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          publish = os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['REQUEST_PUBLISH'] == 'true'
          if os.environ['EVENT_NAME'] == 'push':
              before = os.environ['BEFORE_SHA']
              if not before or set(before) == {'0'}:
                  publish = True
              else:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', before], check=True)
                  changes = subprocess.check_output(['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA'], '--', 'plugin', 'scripts/build.py'], text=True)
                  publish = bool(changes.strip())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('publish=' + str(publish).lower() + '\n')
          PY
      - run: python3 scripts/test.py
      - run: python3 scripts/build.py
  release:
    if: needs.test.result == 'success' && needs.test.outputs.publish == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select version
        id: version
        run: python3 scripts/bump-version.py
      - name: Commit version and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/solartek-sms-auth/solartek-sms-auth.php
          git diff --cached --quiet || git commit -m "Release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"
      - run: python3 scripts/build.py
      - name: Publish installable archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" dist/solartek-sms-auth.zip dist/SHA256SUMS dist/release.json --verify-tag --title "Solartek SMS Auth ${VERSION}" --generate-notes

